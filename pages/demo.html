<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary & Checkout</title>
    <style>
        /* Previous styles remain the same */
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
        }

        table {
            width: 100%;
            margin-bottom: 20px;
            border-collapse: collapse;
        }

        td {
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        .checkboxes {
            margin: 20px 0;
        }

        label {
            display: block;
            margin: 10px 0;
        }

        /* Updated styles for anchor tag */
        #lblSCProceedTo {
            padding: 12px 24px;
            font-size: 16px;
            border-radius: 4px;
            margin-top: 20px;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
        }

        #lblSCProceedTo.disabled {
            background-color: #cccccc !important;
            color: #666 !important;
            cursor: not-allowed;
            opacity: 0.6;
            pointer-events: none;
        }

        #lblSCProceedTo.active {
            background-color: #00e47c;
            color: #08312a !important;
            cursor: pointer;
        }

        #lblSCProceedTo.active:hover {
            background-color: #66EFB0;
        }

        .tax-note {
            color: #666;
            font-size: 0.9em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <h1>Order summary</h1>
    
    <!-- Table remains the same -->
    <table>
        <tr>
            <td>Total items</td>
            <td>7</td>
        </tr>
        <tr>
            <td><strong>Subtotal</strong></td>
            <td>$3.22</td>
        </tr>
        <tr>
            <td><strong>Delivery charge</strong></td>
            <td>$31.43</td>
        </tr>
        <tr>
            <td><strong>Total cost</strong></td>
            <td>$34.65</td>
        </tr>
    </table>

    <!-- Checkboxes remain the same -->
    <div class="checkboxes">
        <label class="terms-checkbox">
            <input type="checkbox">
            I have read and understood the Return policy.
        </label>
        <label class="terms-checkbox">
            <input type="checkbox">
            I have read and understood the Privacy policy.
        </label>
    </div>

    <!-- Updated checkout section with anchor tag -->
    <div class="checkout-section">
        <h2>Checkout</h2>
        <a href="#" id="lblSCProceedTo" class="disabled">Proceed to Checkout</a>
        <p class="tax-note">Please note that VAT/GST/Consumption Tax is not yet included in the price above.</p>
    </div>

    <script>
        const checkboxes = document.querySelectorAll('.terms-checkbox input[type="checkbox"]');
        const checkoutLink = document.getElementById('lblSCProceedTo');

        function updateLinkState() {
            const bothChecked = [...checkboxes].every(checkbox => checkbox.checked);
            
            if(bothChecked) {
                checkoutLink.classList.remove('disabled');
                checkoutLink.classList.add('active');
                checkoutLink.href = "#"; // Replace with actual checkout URL
            } else {
                checkoutLink.classList.add('disabled');
                checkoutLink.classList.remove('active');
                checkoutLink.removeAttribute('href');
            }
        }

        checkboxes.forEach(checkbox => {
            checkbox.addEventListener('change', updateLinkState);
        });

        // Optional: Prevent default action even if someone tries to click disabled link
        checkoutLink.addEventListener('click', (e) => {
            if(checkoutLink.classList.contains('disabled')) {
                e.preventDefault();
            }
        });
    </script>
</body>
</html>
