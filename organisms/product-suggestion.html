<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <meta http-equiv="X-UA-Compatible" content="IE=edge" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <!-- styles -->
   <link rel="stylesheet" href="../assets/css/aos.css">
   <link rel="stylesheet" href="../assets/css/slick.css">
   <link rel="stylesheet" href="../assets/css/slick-theme.css">
   <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
   <link rel="stylesheet" href="../assets/css/style.css" />
   <!-- styles -->
   <title>Document</title>
</head>

<body>
   <!-- body content start -->
   <div class="bi-bespoke bi-feedback bi-prdsuggest">
      <div class="content-wrapper">
         <div class="bi-bespoke__outer">
            <div class="bi-bespoke__img">
               <h4 class="bi-bespoke__txt"><span>Suggest a new product</span></h4>
               <img src="../assets/images/suggestion-prdct.png" alt="img">
            </div>
            <div class="bi-bespoke__newform bi-feedback__newform">
               <div class="bi-input-out">
                  <div class="bi-input">
                     <label for="fname">Your Name <span>*</span></label>
                     <input type="text">
                  </div>
                  <div class="bi-input">
                     <label for="fname">Email <span>*</span></label>
                     <input type="text">
                  </div>
               </div>
               <div class="bi-input-out">
                  <div class="bi-input min-h">
                     <label for="fname">What Country are you based in? <span>*</span></label>
                     <input type="text">
                  </div>
               </div>
               <div class="bi-input w-full">
                     <label for="fname">Share your feedback on the store and our product collection <span>*</span></label>
                     <textarea id="w3review" name="w3review" rows="4" cols="50"></textarea>
                  </div>

                  <div class="bi-input w-full">
                     <label for="fname">Upload references you may have <span>*</span></label>
                     <input type="file">
                  </div>
               <div class="bi-bespoke__captcha">
                 <img src="../assets/images/captcha.png" alt="">
               </div>
               <a href="#" class="bi-btn">Submit</a>
            </div>
         </div>
      </div>
   </div>
   <!-- body content end -->

   <!-- scripts -->
   <script src="../assets/js/jquery.slim.min.js"></script>
   <script src="../assets/js/aos.js"></script>
   <script src="../assets/js/slick.min.js"></script>
   <script src="../assets/js/bootstrap.bundle.min.js"></script>
   <script src="../assets/js/script.js"></script>
   <!-- scripts -->
</body>

</html>
