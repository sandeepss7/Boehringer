<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8" />
   <meta http-equiv="X-UA-Compatible" content="IE=edge" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
   <!-- styles -->
   <link rel="stylesheet" href="../assets/css/aos.css">
   <link rel="stylesheet" href="../assets/css/slick.css">
   <link rel="stylesheet" href="../assets/css/slick-theme.css">
   <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
   <link rel="stylesheet" href="../assets/css/style.css" />
   <!-- styles -->
   <title>Document</title>
</head>

<body>
   <!-- body content start -->
   <div class="bi-bespoke bi-feedback bi-prdsuggest bi-reqsuprt">
      <div class="content-wrapper">
         <div class="bi-bespoke__outer">
            <div class="bi-bespoke__img">
               <h4 class="bi-bespoke__txt"><span>Request a bespoke product to be created</span></h4>
               <img src="../assets/images/req-bes-img.png" alt="img">
            </div>
            <div class="bi-bespoke__newform bi-feedback__newform">
               <div class="bi-input-out">
                  <div class="bi-input">
                     <label for="fname">Project Name <span>*</span></label>
                     <input type="text">
                  </div>
                  <div class="bi-input">
                     <label for="fname">Email <span>*</span></label>
                     <input type="text">
                  </div>
               </div>
               <div class="bi-input-out">
                  <div class="bi-input">
                     <label for="fname">Is your feedback for a personal or company purchase? <span>*</span></label>
                     <input type="text">
                  </div>
                  <div class="bi-input min-h">
                     <label for="fname">What Country are you based in? <span>*</span></label>
                     <input type="text">
                  </div>
               </div>
               <div class="bi-input-out">
                  <div class="bi-input">
                     <label for="fname">Contact number <span>*</span></label>
                     <input type="text">
                  </div>
                  <div class="bi-input">
                     <label for="fname">Email <span>*</span></label>
                     <input type="text">
                  </div>
               </div>
               <div class="bi-input-out">
                  <div class="bi-input">
                     <label for="fname">When do you need this by? <span>*</span></label>
                     <input type="text">
                  </div>
               </div>
               <div class="bi-input w-full">
                  <label for="fname">Tell us about the product, describing what you are looking for
                     <span>*</span></label>
                  <textarea id="w3review" name="w3review" rows="4" cols="50"></textarea>
               </div>
               <div class="bi-input-out">
                  <div class="bi-input">
                     <label for="delivery-country">Delivery country <span>*</span></label>
                     <select id="delivery-country">
                        <option value="">Select country</option>
                        <option value="India">India</option>
                        <option value="USA">USA</option>
                        <option value="UK">UK</option>
                        <option value="Canada">Canada</option>
                        <option value="Australia">Australia</option>
                     </select>
                  </div>

                  <div class="bi-input">
                     <label for="product-name">Product name <span>*</span></label>
                     <select id="product-name">
                        <option value="">Select product</option>
                        <option value="Product A">Product A</option>
                        <option value="Product B">Product B</option>
                        <option value="Product C">Product C</option>
                        <option value="Product D">Product D</option>
                     </select>
                  </div>
               </div>

               <div class="bi-input w-full">
                  <label for="fname">What is this requested bespoke product offering that the current collection does not? <span>*</span></label>
                  <textarea id="w3review" name="w3review" rows="4" cols="50"></textarea>
               </div>
               <div class="bi-input w-full">
                  <label for="fname">Business use case <span>*</span></label>
                  <textarea id="w3review" name="w3review" rows="4" cols="50"></textarea>
               </div>

               <div class="bi-input-out">
                  <div class="bi-input">
                     <label for="delivery-country">Quantity <span>*</span></label>
                     <select id="delivery-country">
                        <option value="">Select Quantity</option>
                        <option value="India">1</option>
                        <option value="USA">2</option>
                        <option value="UK">3</option>
                        <option value="Canada">4</option>
                        <option value="Australia">5</option>
                     </select>
                  </div>
                  <div class="bi-input">
                     <label for="product-name">Additional info <span>*</span></label>
                     <select id="product-name">
                        <option value="">Select Additional info</option>
                        <option value="Product A">Additional info A</option>
                        <option value="Product B">Additional info B</option>
                        <option value="Product C">Additional info C</option>
                        <option value="Product D">Additional info D</option>
                     </select>
                  </div>
               </div>
               <div class="bi-bespoke__captcha">
                  <img src="../assets/images/captcha.png" alt="">
               </div>
               <a href="#" class="bi-btn">Submit</a>
            </div>
         </div>
      </div>
   </div>
   <!-- body content end -->

   <!-- scripts -->  
   <script src="../assets/js/jquery.slim.min.js"></script>
   <script src="../assets/js/aos.js"></script>
   <script src="../assets/js/slick.min.js"></script>
   <script src="../assets/js/bootstrap.bundle.min.js"></script>
   <script src="../assets/js/script.js"></script>
   <!-- scripts -->
</body>

</html>
