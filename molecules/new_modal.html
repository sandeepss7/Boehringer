<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- styles -->
    <link rel="stylesheet" href="../assets/css/aos.css">
    <link rel="stylesheet" href="../assets/css/slick.css">
    <link rel="stylesheet" href="../assets/css/slick-theme.css">
    <link rel="stylesheet" href="../assets/css/bootstrap.min.css">
    <link rel="stylesheet" href="../assets/css/styleold.css">
    <link rel="stylesheet" href="../assets/css/style.css" />
    <!-- styles -->
    <title>Document</title>
  </head>
  <body>
    <!-- body content start -->
    
    <div class="bi-newmodal">
      <!-- header -->
      <h4 class="bi-heading__sub">
        Unisex sweatshirt dark green
      </h4>
      <!-- selection drpdowns -->
      <div class="bi-newmodal__selections">
        <div class="bi-newmodal__fieldgrp">
          <label class="bi-newmodal__fieldlabel">Select varient</label>
          <select class="bi-newmodal__drpdwn">
            <option>Male, Medium, Red</option>
          </select>
        </div>
        
        <div class="bi-newmodal__fieldgrp">
          <label class="bi-newmodal__fieldlabel">Quantity</label>
          <input type="number" class="bi-newmodal__fieldinput" value="334">
        </div>
        
        <div class="bi-newmodal__fieldgrp">
          <label class="bi-newmodal__fieldlabel">Shipment Mode</label>
          <select class="bi-newmodal__drpdwn">
            <option>Air</option>
          </select>
        </div>
      </div>
      <!-- details -->
      <div class="bi-newmodal__detailswrap">
        <div class="bi-newmodal__pricedtls">
          <div class="bi-newmodal__priceitm">
            <span class="bi-newmodal__pricelbl">Unit price:</span>
            <span class="bi-newmodal__pricevalue">$22.78</span>
          </div>
          
          <div class="bi-newmodal__priceitm">
            <span class="bi-newmodal__pricelbl">Shipping:</span>
            <span class="bi-newmodal__pricevalue">$50.08</span>
          </div>
          
          <div class="bi-newmodal__priceitm">
            <span class="bi-newmodal__pricelbl">Total cost:</span>
            <span class="bi-newmodal__pricevalue">$72.78</span>
          </div>
        </div>
        <div class="bi-newmodal__detailsbtn">
          <a href="#" class="bi-btn">Add</a>
        </div>
      </div>
      <!-- table -->
       <div class="bi-newmodal__table">
        <img src="../assets/images/new-modal-table.png" alt="table">
       </div>
       <!-- btn -->
        <div class="bi-newmodal__crtbtn">
          <a href="#" class="bi-btn">Add to cart</a>
        </div>
    </div>

    <!-- body content end -->

    <!-- scripts -->
    <script src="../assets/js/jquery.slim.min.js"></script>
    <script src="../assets/js/aos.js"></script>
    <script src="../assets/js/slick.min.js"></script>
    <script src="../assets/js/bootstrap.bundle.min.js"></script>
    <script src="../assets/js/script.js"></script>
    <!-- scripts -->
  </body>
</html>
